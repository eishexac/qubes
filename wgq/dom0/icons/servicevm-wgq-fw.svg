<!--
    wgq zone firewall icon (label 'wgq-fw'): the Qubes service cube with
    a shield on its pale face. Green, following the sys-firewall
    convention -- this is the filter clients sit behind.

    Qubes resolves icons as <class>-<label-name>; a service qube wearing
    the custom label 'wgq-fw' resolves exactly this name, so no stock
    icon is shadowed and no stock qube can wear it. Installed by
    wg-icons.sls into dom0's /usr/local/share/icons/hicolor/scalable/apps/.

    Cube geometry derived from qubes-artwork's servicevm icons,
    (c) Invisible Things Lab, CC BY-SA 4.0. This file: CC BY-SA 4.0.
-->
