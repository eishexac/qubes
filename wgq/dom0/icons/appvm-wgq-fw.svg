<?xml version="1.0" encoding="UTF-8"?>
<!--
    wgq firewall qube (label wgq-fw) icon at its appvm- name. A wgq VPN/firewall qube is
    class AppVM; the servicevm feature that renames its icon to the
    servicevm- form is set one salt state AFTER the qube is created, so
    for that instant the icon name is appvm-<label>. Without this file
    the running menu resolves nothing there, caches a blank, and never
    refreshes, costing a relogin per zone. Same art as servicevm-wgq-fw.svg: a
    wgq qube looks like a wgq qube at every name it can wear.

    Cube geometry derived from qubes-artwork's servicevm icons,
    (c) Invisible Things Lab, CC BY-SA 4.0. This file: CC BY-SA 4.0.
-->
