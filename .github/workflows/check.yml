name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the release gate below diffs against each
          # project's latest release tag.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter Debian 13 (the target template) ships.
          python-version: "3.13"

      # Optional locally, mandatory here: nothing merges unlinted or with
      # an unparsed Salt state.
      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python -m pip install --quiet pyyaml jinja2

      - name: Confirm the linters are actually present
        run: |
          command -v shellcheck
          python -c 'import yaml, jinja2'

      - name: make check
        run: make check

      - name: make verify
        run: make verify

      - name: No key material or account numbers in the tree
        run: |
          # Config templates named *peers.py* and test fixtures may carry
          # PrivateKey lines (placeholder or the published dummy key);
          # nothing else may.
          if git grep -nE 'PrivateKey[[:space:]]*=' -- . \
              | grep -v '__PRIVATE_KEY__' \
              | grep -vE '/peers\.py:|(^|/)test/'; then
            echo "::error::a PrivateKey assignment outside a template or tests"
            exit 1
          fi
          if git grep -nE '\b[0-9]{16}\b' -- . ; then
            echo "::error::a 16-digit run that could be an account number"
            exit 1
          fi
          echo "clean"

      # Releases stay human: only a signed tag pushed by the maintainer cuts
      # one (release.yml), because the signature is the trust root and CI
      # must never hold the key. What CI enforces instead, per project:
      # shipped bytes may not change under an already-released version
      # (deterministic builds make version <-> artifact a one-to-one
      # promise), and a bumped, unreleased version earns a reminder --
      # while projects without a first release, and repo-level churn,
      # stay silent. Shipped merges accumulate under one pending version
      # until the maintainer decides to tag.
      - name: Shipped changes require a version bump; pending versions get a nudge
        run: |
          rc=0
          for makefile in */Makefile; do
            p=${makefile%/Makefile}
            tag=$(git tag -l "$p-v*" --sort=-v:refname | head -1)
            if [ -z "$tag" ]; then
              echo "$p: no release tag yet; gate idle"
              continue
            fi
            ver=$(make -s -C "$p" version)
            # tools/ is included: shared build helpers change artifact bytes.
            if git diff --quiet "$tag" HEAD -- "$p" tools; then
              echo "$p: no shipped changes since $tag"
              continue
            fi
            if [ "$p-v$ver" = "$tag" ]; then
              echo "::error::$p changed since $tag but its version is still $ver; bump it in this change"
              rc=1
            else
              echo "::notice::$p $ver carries shipped changes and no release yet. When ready: git tag -s $p-v$ver && git push origin $p-v$ver"
            fi
          done
          exit $rc
