# Releases, per project.
#
# Tags are namespaced <project>-vX.Y.Z; this workflow parses the project
# out of the tag and releases that project alone -- a tag for one project
# never rebuilds or ships another. The source is the distribution; a
# release is a signed tag plus, as a convenience, whatever `make` produces
# for that project (a formula-only project releases as tag + notes, no
# files). Deterministic builds mean nobody has to trust this workflow or
# its runner: the published SHA256SUMS is checkable by rebuilding from the
# tag.
#
# Flow: the maintainer signs and pushes a tag (git tag -s wgq-v0.1.0 &&
# git push origin wgq-v0.1.0). This workflow runs the full checks, proves
# the builds reproduce, confirms the tag matches the project's own
# `make version`, and opens a DRAFT release -- a human presses publish.
# workflow_dispatch runs check + verify as a dry run without creating
# anything.

name: release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter Debian 13 (the target template) ships.
          python-version: "3.13"

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python -m pip install --quiet pyyaml jinja2

      - name: make check
        run: make check

      - name: make verify
        run: make verify

      - name: The tag must name a project and match its version
        if: github.ref_type == 'tag'
        run: |
          project="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          if [ ! -f "$project/Makefile" ]; then
            echo "::error::tag $GITHUB_REF_NAME names no project directory '$project'"
            exit 1
          fi
          v=$(make -s -C "$project" version)
          if [ "$v" != "$version" ]; then
            echo "::error::tag says $version but '$project' says it is $v"
            exit 1
          fi
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Source is the distribution: clone it, read \`$PROJECT/\`, run \`make\`."
            echo
            echo "Any attached artifacts are exactly what \`make -C $PROJECT\` produces,"
            echo "for convenience only. The build is deterministic, so check it instead"
            echo "of trusting it:"
            echo
            echo '    git verify-tag '"$GITHUB_REF_NAME"
            echo '    git checkout '"$GITHUB_REF_NAME"
            echo '    make -C '"$PROJECT"' && sha256sum '"$PROJECT"'/dist/*   # must equal SHA256SUMS'
          } > notes.md
          assets=""
          if [ -d "$PROJECT/dist" ] && [ -n "$(ls -A "$PROJECT/dist")" ]; then
            (cd "$PROJECT/dist" && sha256sum -- *) > SHA256SUMS
            cat SHA256SUMS
            assets="$PROJECT/dist/* SHA256SUMS"
          else
            echo "no build artifacts; releasing tag + notes only"
          fi
          # $assets stays unquoted so the dist glob expands; project names
          # and artifact files never contain spaces (the airlock enforces the
          # same character set).
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$PROJECT $VERSION" \
            --notes-file notes.md \
            $assets
